services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savetowin
      POSTGRES_PASSWORD: savetowin
      POSTGRES_DB: savetowin
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U savetowin -d savetowin']
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - '${APP_PORT:-3010}:3010'
    environment:
      DATABASE_URL: postgres://savetowin:savetowin@db:5432/savetowin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3010
      NODE_ENV: production
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: ['https']
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
