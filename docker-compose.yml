services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savetowin
      POSTGRES_PASSWORD: savetowin
      POSTGRES_DB: savetowin
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U savetowin -d savetowin']
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - '${APP_PORT:-3010}:3010'
    environment:
      DATABASE_URL: postgres://savetowin:savetowin@db:5432/savetowin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3010
      NODE_ENV: production
      # Zona horaria de «hoy» (suscripciones, mes actual). Cámbiala en .env.
      TZ: ${TZ:-Europe/Madrid}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      # IP real para el límite de intentos: cloudflare (túnel/proxy de Cloudflare) o proxy (Caddy…).
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      # Correo saliente (cambio de email/contraseña). Sin SMTP_HOST no se envía.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: ['https']
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
