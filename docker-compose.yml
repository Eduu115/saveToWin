services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savetowin
      POSTGRES_PASSWORD: savetowin
      POSTGRES_DB: savetowin
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U savetowin -d savetowin']
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
