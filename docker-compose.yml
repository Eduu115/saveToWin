services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savetowin
      # En producción, una propia en .env (solo se aplica al crear el volumen; para
      # cambiarla después: ALTER USER, ver README).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savetowin}
      POSTGRES_DB: savetowin
    # Solo en local (desarrollo y copias): la app entra por la red interna de Docker.
    # Abierto a la red, cualquiera con la contraseña de ejemplo leería los datos.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U savetowin -d savetowin']
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  app:
    build: .
    ports:
      - '${APP_PORT:-3010}:3010'
    environment:
      DATABASE_URL: postgres://savetowin:${POSTGRES_PASSWORD:-savetowin}@db:5432/savetowin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3010
      NODE_ENV: production
      # Zona horaria de «hoy» (suscripciones, mes actual). Cámbiala en .env.
      TZ: ${TZ:-Europe/Madrid}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      # IP real para el límite de intentos: cloudflare (túnel/proxy de Cloudflare) o proxy (Caddy…).
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      # Correo saliente (cambio de email/contraseña). Sin SMTP_HOST no se envía.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

  caddy:
    profiles: ['https']
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
