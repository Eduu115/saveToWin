name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Todos los *.test.ts del repo (shared, server/test y, en el privado, pro/tests).
      - run: npx vitest run
      - run: npm run build
