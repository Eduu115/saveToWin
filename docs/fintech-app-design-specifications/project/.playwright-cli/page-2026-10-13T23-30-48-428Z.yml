        - generic [ref=e6728]: "Accesibilidad del par ingreso/gasto: cian / naranja, el par con mayor separación posible en las tres formas de daltonismo, más signo y flecha. El fondo oscuro permite subir la croma de las 12 categóricas a 0.15 sin que chillen. Ojo: el heatmap de 31 días solo funciona bien en oscuro; en el tema claro de esta dirección hay que invertir la escala secuencial (ya incluida). Es la dirección más \"instrumento\" y la que peor envejece si la app crece hacia lo doméstico."